name: Deploy archived site

# Project closed after the October 2026 trip. The site is a read-only
# archive of the last committed snapshot: no schedule, no data fetching,
# no AI calls. Deploys only on push or manual trigger.
# To revive live monitoring, restore the schedule + ingest steps from git
# history (commit b8918ce) and add an ANTHROPIC_API_KEY secret if wanted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
